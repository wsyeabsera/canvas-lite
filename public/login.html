<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - Lite</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f3f5fa; font: 14px/1.4 -apple-system, system-ui, sans-serif;
    background: radial-gradient(1100px 700px at 8% -10%, rgba(99,102,241,.42), transparent 60%), radial-gradient(900px 600px at 100% 10%, rgba(236,72,153,.22), transparent 60%), radial-gradient(1000px 700px at 70% 115%, rgba(20,184,166,.28), transparent 60%), #0a0c13; }
  main { width: min(440px, calc(100% - 32px)); padding: 32px; border: 1px solid rgba(255,255,255,.15); border-radius: 20px; background: rgba(14,17,28,.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 50px rgba(0,0,0,.35); }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  h1 { margin: 18px 0 6px; font-size: 34px; letter-spacing: -.02em; }
  p { margin: 0; color: #a7aec2; }
  .lg-l { display: block; margin: 24px 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #a7aec2; }
  input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; background: rgba(255,255,255,.06); color: #f3f5fa; font: inherit; outline: 0; }
  input:focus { box-shadow: 0 0 0 2px #7aa2ff; }
  input[aria-invalid="true"] { border-color: #f87171; }
  .lg-msg { min-height: 1.4em; margin-top: 8px; color: #f87171; }
  button { width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 999px; background: #7aa2ff; color: #0a0c13; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <div class="logo">Lite</div>
  <form id="login" class="lg">
    <h1>Sign in</h1>
    <p>Enter the password to watch what Claude is designing.</p>
    <label class="lg-l" for="lg-pw">Password</label>
    <input id="lg-pw" name="password" type="password" autocomplete="current-password" aria-describedby="lg-msg" autofocus required>
    <p class="lg-msg" id="lg-msg" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script type="module" src="/login-page.js"></script>
</body>
</html>
