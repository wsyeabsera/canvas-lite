<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bgimg: radial-gradient(1100px 700px at 8% -10%, rgba(99,102,241,.42), transparent 60%), radial-gradient(900px 600px at 100% 10%, rgba(236,72,153,.22), transparent 60%), radial-gradient(1000px 700px at 70% 115%, rgba(20,184,166,.28), transparent 60%), #0a0c13;
    --g: rgba(255,255,255,.07); --gb: rgba(255,255,255,.15);
    --tx: #f3f5fa; --mu: #a7aec2; --chip: rgba(255,255,255,.1); --sel: rgba(255,255,255,.12);
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --ac: #7aa2ff;
    --sh: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 50px rgba(0,0,0,.35);
  }
  /* Light before JS runs: follow the system unless the user picked dark. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) {
      color-scheme: light;
      --bgimg: radial-gradient(1100px 700px at 8% -10%, rgba(99,102,241,.30), transparent 60%), radial-gradient(900px 600px at 100% 10%, rgba(244,114,182,.28), transparent 60%), radial-gradient(1000px 700px at 70% 115%, rgba(45,212,191,.32), transparent 60%), #eef1f9;
      --g: rgba(255,255,255,.58); --gb: rgba(255,255,255,.85);
      --tx: #14161d; --mu: #586077; --chip: rgba(20,22,29,.07); --sel: rgba(20,22,29,.08);
      --ok: #16a34a; --warn: #b45309; --bad: #dc2626; --ac: #3b5bdb;
      --sh: inset 0 1px 0 rgba(255,255,255,.9), 0 18px 40px rgba(40,50,90,.14);
    }
  }
  :root[data-theme=light] {
    color-scheme: light;
    --bgimg: radial-gradient(1100px 700px at 8% -10%, rgba(99,102,241,.30), transparent 60%), radial-gradient(900px 600px at 100% 10%, rgba(244,114,182,.28), transparent 60%), radial-gradient(1000px 700px at 70% 115%, rgba(45,212,191,.32), transparent 60%), #eef1f9;
    --g: rgba(255,255,255,.58); --gb: rgba(255,255,255,.85);
    --tx: #14161d; --mu: #586077; --chip: rgba(20,22,29,.07); --sel: rgba(20,22,29,.08);
    --ok: #16a34a; --warn: #b45309; --bad: #dc2626; --ac: #3b5bdb;
    --sh: inset 0 1px 0 rgba(255,255,255,.9), 0 18px 40px rgba(40,50,90,.14);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --g: rgba(34,38,56,.92); }
    :root[data-theme=light] { --g: rgba(255,255,255,.94); }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    @media (prefers-color-scheme: light) { :root:not([data-theme=dark]) { --g: rgba(255,255,255,.94); } }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: #0a0c13; }
  body {
    margin: 0; min-height: 100dvh; display: flow-root; color: var(--tx); background: var(--bgimg) fixed;
    font: 400 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  h1, h2 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
  h1 { font-size: 22px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mu); font-weight: 500; }
  a { color: var(--ac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

  .glass {
    background: var(--g); border: 1px solid var(--gb); box-shadow: var(--sh);
    -webkit-backdrop-filter: blur(28px) saturate(1.5); backdrop-filter: blur(28px) saturate(1.5);
    border-radius: 22px;
  }

  #app { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; padding: 16px; min-height: 100dvh; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 20px; border-radius: 999px; flex-wrap: wrap; }
  .brand { font-weight: 600; font-size: 16px; letter-spacing: -.02em; }
  #status { color: var(--mu); display: inline-flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
  #status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mu); }
  #status[data-state=ok]::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status[data-state=wait]::before { background: var(--warn); }
  #status[data-state=bad]::before { background: var(--bad); }
  .ro { font-size: 12px; color: var(--mu); background: var(--chip); padding: 2px 10px; border-radius: 999px; }
  .bar .sp { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .bar .sp a { color: var(--mu); }
  #theme-toggle {
    font: inherit; font-weight: 500; color: var(--tx); background: var(--chip); border: 1px solid var(--gb);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  #theme-toggle:hover { background: var(--sel); }

  .layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; flex: 1; min-height: 0; }
  nav { flex: 1 1 220px; max-width: 280px; padding: 18px; align-self: flex-start; }
  nav h2 { margin-bottom: 10px; }
  #projects { display: flex; flex-direction: column; gap: 2px; }
  #projects li { padding: 7px 10px; border-radius: 12px; cursor: pointer; overflow-wrap: anywhere; }
  #projects li:hover, #projects li.sel, #projects li[aria-current] { background: var(--sel); }
  #projects a { color: var(--tx); display: flex; align-items: baseline; gap: 8px; }
  #projects li:has(> a[aria-current]) { background: var(--sel); font-weight: 500; }
  #projects .count { margin-left: auto; color: var(--mu); font-size: 12px; }
  #projects a > span:not(.count) { color: var(--mu); font-size: 12px; }
  #projects a:hover { text-decoration: none; }
  main { flex: 999 1 560px; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  #view-activity { display: flex; flex-direction: column; min-height: 0; }
  #view-activity h1 { margin-bottom: 12px; }
  #events { max-height: calc(100dvh - 240px); min-height: 220px; overflow: auto; font: 400 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #events li, #project-events li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 10px; border-radius: 12px; }
  #events li:hover, #project-events li:hover { background: var(--sel); }
  li .t { color: var(--mu); }
  li .n { color: var(--mu); opacity: .7; min-width: 4ch; }
  li .k { background: var(--chip); border-radius: 999px; padding: 0 9px; font-size: 12px; }
  li .k.open { background: color-mix(in srgb, var(--ac) 22%, transparent); color: var(--ac); }
  li .p { color: var(--ac); font-weight: 500; }
  li .d { color: var(--tx); min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; flex: 1 1 200px; }
  li.new { background: color-mix(in srgb, var(--ac) 14%, transparent); }
  @media (prefers-reduced-motion: no-preference) {
    li.new { animation: fade 2.4s ease-out forwards; }
    @keyframes fade { from { background: color-mix(in srgb, var(--ac) 28%, transparent); } to { background: transparent; } }
  }

  #view-project { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  #view-project > * { min-width: 0; }
  .hd { grid-column: 1 / -1; padding: 18px 20px; }
  #project-title { overflow-wrap: anywhere; }
  #project-meta { color: var(--mu); margin-top: 6px; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  #project-meta .chip { background: color-mix(in srgb, var(--ac) 22%, transparent); color: var(--ac); border-radius: 999px; padding: 1px 11px; font-size: 12.5px; font-weight: 500; }
  #project-meta a { color: var(--ac); }
  #project-meta .desc { flex: 1 1 100%; }
  .card { padding: 18px; }
  .card h2 { margin-bottom: 10px; }
  #project-files, #project-events { max-height: 60dvh; overflow: auto; font: 400 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #project-files li { padding: 5px 10px; border-radius: 12px; overflow-wrap: anywhere; }
  #project-files li:hover { background: var(--sel); }
  @media (max-width: 720px) { #view-project { grid-template-columns: minmax(0, 1fr); } }

  #locked { max-width: 460px; margin: 18vh auto 0; padding: 28px; text-align: center; width: calc(100% - 32px); }
  #locked h1 { margin-bottom: 10px; }
  #locked p { color: var(--mu); margin: 8px 0 0; }
  #locked code { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 1px 7px; border-radius: 8px; color: var(--tx); overflow-wrap: anywhere; }

  @media (max-width: 640px) {
    .bar { border-radius: 28px; padding: 10px 14px; }
    nav { max-width: none; flex-basis: 100%; }
    main { flex-basis: 100%; padding: 16px; }
    #events { max-height: 60dvh; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="bar glass">
    <span class="brand">Lite</span>
    <span id="status" data-state="wait">connecting</span>
    <span class="ro">read-only</span>
    <div class="sp"><a href="/docs/">docs</a><button id="theme-toggle" type="button" aria-label="Theme: auto (click to change)">Theme: auto</button></div>
  </header>
  <div class="layout">
    <nav class="glass" aria-label="Projects">
      <h2>Projects</h2>
      <ul id="projects"></ul>
    </nav>
    <main class="glass">
      <section id="view-activity">
        <h1>Activity</h1>
        <ul id="events" aria-live="polite"></ul>
      </section>
      <section id="view-project" hidden>
        <div class="hd glass"><h1 id="project-title"></h1><div id="project-meta"></div></div>
        <div class="card glass"><h2>Files</h2><ul id="project-files"></ul></div>
        <div class="card glass"><h2>Events</h2><ul id="project-events"></ul></div>
      </section>
    </main>
  </div>
</div>
<section id="locked" class="glass" hidden>
  <h1>Open Lite with your token</h1>
  <p>Open <code>/#token=&lt;your token&gt;</code> once. Everything after the # stays in your browser and is never sent to the server.</p>
</section>
<script type="module" src="/page.js"></script>
</body>
</html>
